<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Stylized illustration of the Aorila home robot concept">
  <rect width="640" height="360" fill="#f7f7f4"/>
  <!-- subtle backdrop shapes -->
  <circle cx="520" cy="70" r="120" fill="#d8ff36" opacity="0.25"/>
  <circle cx="110" cy="300" r="90" fill="#1647ff" opacity="0.08"/>
  <rect x="0" y="292" width="640" height="68" fill="#10100f" opacity="0.05"/>
  <!-- floor shadow -->
  <ellipse cx="320" cy="308" rx="130" ry="16" fill="#10100f" opacity="0.12"/>
  <!-- wheeled base -->
  <rect x="232" y="262" width="176" height="34" rx="17" fill="#10100f"/>
  <circle cx="272" cy="296" r="16" fill="#10100f"/>
  <circle cx="272" cy="296" r="7" fill="#f7f7f4"/>
  <circle cx="368" cy="296" r="16" fill="#10100f"/>
  <circle cx="368" cy="296" r="7" fill="#f7f7f4"/>
  <!-- torso -->
  <rect x="262" y="120" width="116" height="150" rx="34" fill="#10100f"/>
  <rect x="282" y="140" width="76" height="10" rx="5" fill="#d8ff36"/>
  <rect x="282" y="158" width="52" height="8" rx="4" fill="#f7f7f4" opacity="0.35"/>
  <!-- chest light -->
  <circle cx="320" cy="205" r="12" fill="#ff5b22"/>
  <circle cx="320" cy="205" r="5" fill="#f7f7f4"/>
  <!-- head -->
  <circle cx="320" cy="78" r="40" fill="#10100f"/>
  <rect x="288" y="66" width="64" height="22" rx="11" fill="#d8ff36"/>
  <!-- neck -->
  <rect x="308" y="112" width="24" height="16" fill="#10100f"/>
  <!-- arms -->
  <rect x="216" y="140" width="34" height="96" rx="17" fill="#10100f" transform="rotate(8 233 188)"/>
  <rect x="390" y="140" width="34" height="96" rx="17" fill="#10100f" transform="rotate(-8 407 188)"/>
  <circle cx="228" cy="248" r="14" fill="#1647ff"/>
  <circle cx="412" cy="248" r="14" fill="#1647ff"/>
  <!-- motion accents -->
  <line x1="180" y1="120" x2="150" y2="120" stroke="#ff5b22" stroke-width="8" stroke-linecap="round"/>
  <line x1="460" y1="120" x2="490" y2="120" stroke="#ff5b22" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="170" x2="140" y2="170" stroke="#1647ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="460" y1="170" x2="500" y2="170" stroke="#1647ff" stroke-width="8" stroke-linecap="round"/>
</svg>
